name: Monthly Ledger Analysis

"on":
  schedule:
    - cron: '0 0 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ledger-analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run monthly close + mermaid analysis
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
        run: python ledger_analysis/ledger_analysis.py

      - name: Export to Google Sheet
        env:
          NOTION_SECRET: ${{ secrets.NOTION_SECRET }}
          SHEET_WEBAPP_URL: ${{ secrets.SHEET_WEBAPP_URL }}
          SHEET_TOKEN: ${{ secrets.SHEET_TOKEN }}
        run: python ledger_analysis/export_sheet.py
